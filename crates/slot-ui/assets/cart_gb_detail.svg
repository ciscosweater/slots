<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 274">
  <!-- One precise capsule: common centreline, equal 17 px end radii and level edges. -->
  <rect x="24" y="14" width="192" height="34" rx="17"
        fill="#000" opacity="0.06"/>
  <path d="M 41 14 H 199 A 17 17 0 0 1 216 31
           M 24 31 A 17 17 0 0 1 41 14"
        fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 24 31 A 17 17 0 0 0 41 48 H 199 A 17 17 0 0 0 216 31"
        fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Ribs share a 6.5 px pitch and terminate exactly on the capsule tangents. -->
  <path d="
    M 4 18 L 24 18
    M 4 24.5 L 24 24.5
    M 4 31 L 24 31
    M 4 37.5 L 24 37.5
    M 4 44 L 24 44
  " fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
  <path d="
    M 4 19.2 L 24 19.2
    M 4 25.7 L 24 25.7
    M 4 32.2 L 24 32.2
    M 4 38.7 L 24 38.7
    M 4 45.2 L 24 45.2
  " fill="none" stroke="#fff" stroke-width="1.0" stroke-linecap="round" opacity="0.6"/>

  <!-- The upper-right lock step occupies y=0..18, hence four ribs on this side. -->
  <path d="
    M 216 24.5 L 236 24.5
    M 216 31 L 236 31
    M 216 37.5 L 236 37.5
    M 216 44 L 236 44
  " fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
  <path d="
    M 216 25.7 L 236 25.7
    M 216 32.2 L 236 32.2
    M 216 38.7 L 236 38.7
    M 216 45.2 L 236 45.2
  " fill="none" stroke="#fff" stroke-width="1.0" stroke-linecap="round" opacity="0.6"/>

  <!-- Fine moulded thumb arrow, matching the visual weight of the GBA detail. -->
  <path d="M 104 244 H 136 L 120 257 Z"
        fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M 106 245 H 134 L 120 255.5"
        fill="none" stroke="#fff" stroke-width="0.65" stroke-linejoin="round" opacity="0.55"/>
</svg>
