[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"

# Device startup pays for every page read from the SD card. Thin LTO and symbol stripping keep
# the shipped executable smaller while retaining enough optimization for the frame loop; abort
# panics remove unwinding tables that are not useful on a fixed-function appliance.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
png = "0.17"
fontdue = "0.9"
libloading = "0.8"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"
cpal = "0.15"
gilrs = "0.11"
tempfile = "3"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
